
services:
    backend:
        depends_on:
            - database
        image: lufs-backend
        pull_policy: never
        container_name: lufs-backend
        build:
            context: ./backend
            dockerfile: Dev.Dockerfile
        environment:
            PGPASSFILE: /run/secrets/pgpass
            POSTGRES_URL: postgresql+psycopg2://main@database:5433/lafs
        secrets:
            - pgpass
        command:
            - /bin/sh
            - -c
            - >-
                cp "$$PGPASSFILE" /tmp/pgpass &&
                chmod 600 /tmp/pgpass &&
                export PGPASSFILE=/tmp/pgpass &&
                exec uv run fastapi dev --host backend --port 8000

        ports:
            - 127.0.0.1:8000:8000
        volumes:
            - lafs-volume:/image_uploads

    frontend:
        depends_on:
            - backend
        image: lufs-frontend
        pull_policy: never
        container_name: lufs-frontend
        build:
            context: ./frontend
            dockerfile: Dockerfile
        environment:
            VITE_PROXY_TARGET: http://backend:8000
        ports:
            - 5173:5173

    database:
        image: pgvector/pgvector@sha256:9d9c930220cb9bf2f956d10a8f909cf9973d9672ca0278aef2c1e6facccad2e0
        container_name: lufs-database
        environment:
            PGPORT: 5433
            POSTGRES_USER: main
            POSTGRES_DB: lafs
            POSTGRES_PASSWORD_FILE: /run/secrets/pgpassword
            PGPASSFILE: /run/secrets/pgpass
        secrets:
            - pgpass
            - pgpassword
        ports:
            - 127.0.0.1:5433:5433
        volumes:
            - lafs-volume:/var/lib/postgresql
        
    ollama:
        image: ollama/ollama@sha256:dea72d1e22270fe095b68fdf756d2b489d615643c5a2eaebbc5f569181e322d8
        container_name: ollama
        ports:
            - 11434:11434
        volumes:
            - ./model_files:/model_files
            - ollama:/root/.ollama
        pull_policy: always
        tty: true
        restart: unless-stopped
        entrypoint: ["/bin/sh", "/model_files/run_ollama.sh"]
    

volumes:
    lafs-volume:
    
    ollama:
secrets:
    pgpass:
        file: secrets/.pgpass
    pgpassword:
        file: secrets/pgpassword