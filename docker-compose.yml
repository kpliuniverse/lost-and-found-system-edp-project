
services:
    backend:
        depends_on:
            - database
        image: lufs-backend
        pull_policy: never
        container_name: lufs-backend
        build:
            context: ./backend
            dockerfile: Dockerfile
            target: runner
        environment:

            PGPASSFILE: /run/secrets/pgpass
            POSTGRES_URL: postgresql+psycopg2://main@database:5433/lafs
        secrets:
            - pgpass
            - postgres
        

    frontend:
        depends_on:
            - backend
        image: lufs-frontend
        pull_policy: never
        container_name: lufs-frontend
        build:
            context: ./frontend
            dockerfile: Dockerfile
        environment:
            VITE_PROXY_TARGET: http://backend:8000
        ports:
            - 0.0.0.0:5173:5173

    database:
        image: postgres@sha256:800ce8c1c6509d8fb74e1d93cf4aff1f93e13b431dea386d798c52cce0d9a16b
        container_name: lufs-database
        environment:
            POSTGRES_USER: lafs
            POSTGRES_PASSWORD_FILE: /run/secrets/postgrespassword
            PGPASSFILE: /run/secrets/pgpass
        secrets:
            - pgpass
        


volumes:
    postgresql-data:

secrets:
    pgpass:
        file: secrets/.pgpass
    postgrespassword:
        file: secrets/.postgrespassword