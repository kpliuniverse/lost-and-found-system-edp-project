services:
    backend:
        image: lufs-backend
        pull_policy: never
        container_name: lufs-backend
        build:
            context: ./backend
            dockerfile: Dockerfile
            target: runner
        ports:
            - 8000:8000
        env_file:
            - ./backend/.env

    frontend:
        image: lufs-frontend
        pull_policy: never
        container_name: lufs-frontend
        build:
            context: ./frontend
            dockerfile: Dockerfile
        environment:
            VITE_PROXY_TARGET: http://backend:8000
        ports:
            - 5173:5173

    database:
        image: postgres@sha256:800ce8c1c6509d8fb74e1d93cf4aff1f93e13b431dea386d798c52cce0d9a16b
        container_name: lufs-database
        env_file:
            - ./postgresql/.env
        volumes:
            - ./postgresql-data:/var/lib/postgresql/data


volumes:
    postgresql-data:
