services:
    backend:
        image: lufs-backend
        pull_policy: never
        container_name: lufs-backend
        build:
            context: ./backend
            dockerfile: Dockerfile
            target: runner
        ports:
            - 8000:8000

    frontend:
        image: lufs-frontend
        pull_policy: never
        container_name: lufs-frontend
        build:
            context: ./frontend
            dockerfile: Dockerfile
        environment:
            VITE_PROXY_TARGET: http://backend:8000
        ports:
            - 5173:5173