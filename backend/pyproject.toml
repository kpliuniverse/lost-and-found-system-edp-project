[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["wheels*"]

[project]
name = "lost-and-found-backend"
requires-python = "==3.14.9"
version = "0.1.0"
dependencies = [
    "fastapi[standard]>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "psycopg2-binary",
    "alembic>=1.20.0",
    "pendulum>=3.3.0",
    "python-multipart>=0.0.32",
    "python-magic>=0.4.27",
    "pgvector>=0.5.1",
    "ollama>=0.6.3",
    "sentence-transformers[image]>=6.2.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "pillow>=13.0.0",
    "vercel-blob>=0.5.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
